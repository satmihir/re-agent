name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # bench/behavior_test.py builds a toy Go program as its migration fixture.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.3'
      - name: Offline Python bench tests
        run: python3 -m unittest discover -s bench -p '*test.py'

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Hosted ARM64 capacity shortages cancel jobs before any tests run.
        os: [ubuntu-latest, macos-26-intel]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - run: cargo +1.99.1 fmt --check
      - run: cargo +1.99.1 build --locked
      - run: cargo +1.99.1 test --locked
