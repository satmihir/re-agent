name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.3'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: Test and measure coverage
        run: |
          go test -coverprofile=coverage.out ./...
          total=$(go tool cover -func=coverage.out | awk '$1 == "total:" {print $3}')
          echo "Total coverage: $total" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "COVERAGE=$total" >> "$GITHUB_ENV"
      - name: Offline Python bench tests
        run: python3 -m unittest discover -s bench -p '*test.py'
      - name: Generate coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir site
          cat > site/coverage.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="155" height="20" role="img" aria-label="coverage: $COVERAGE">
            <title>coverage: $COVERAGE</title>
            <rect width="155" height="20" rx="3" fill="#555"/>
            <path d="M85 0h67a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H85z" fill="#4c1"/>
            <g fill="#fff" font-family="Verdana,sans-serif" font-size="11" text-anchor="middle">
              <text x="42" y="14">coverage</text>
              <text x="120" y="14">$COVERAGE</text>
            </g>
          </svg>
          EOF
          printf '<!doctype html><title>re:agent coverage</title><img src="coverage.svg" alt="coverage">\n' > site/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
